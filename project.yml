# XcodeGen spec — the .xcodeproj is generated on the macOS CI runner,
# so nothing Xcode-specific has to be edited by hand on Windows.
name: QVision
options:
  bundleIdPrefix: com.qvision
  deploymentTarget:
    visionOS: "2.0"
  createIntermediateGroups: true

# NVIDIA CloudXR client framework (binary Swift package, NVIDIA SLA): Server mode.
packages:
  CloudXRKit:
    url: https://github.com/NVIDIA/cloudxr-framework
    exactVersion: 6.2.0  # client and CloudXR Runtime versions must match (NVIDIA FAQ)

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.8.1"
    CURRENT_PROJECT_VERSION: "10"

targets:
  QVision:
    type: application
    platform: visionOS
    dependencies:
      - package: CloudXRKit
    sources:
      - path: App/Sources
      - path: App/Assets.xcassets
      - path: App/Resources
        buildPhase: resources
        excludes:
          - "**/.keep"
    settings:
      base:
        PRODUCT_NAME: QVision
        PRODUCT_BUNDLE_IDENTIFIER: com.qvision.app
        TARGETED_DEVICE_FAMILY: "7"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: NO
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: QVision
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # Lets the app's Documents folder show up in the Files app on the
        # headset ("On My Apple Vision Pro › QVision").
        NSHandsTrackingUsageDescription: QVision uses hand tracking for fly mode (clench both fists to move) and for the palm Layers menu.
        NSWorldSensingUsageDescription: QVision uses world tracking to place models in front of you.
        NSLocalNetworkUsageDescription: QVision connects to your PC or office server on the local network to stream Unreal Engine scenes (NVIDIA CloudXR) and to download rendered scenes from the QVision Library.
        # v0.8: plain HTTP to the QVision Library on the PC (LAN only, port 8770).
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UIApplicationSceneManifest:
          UIApplicationPreferredDefaultSceneSessionRole: UIWindowSceneSessionRoleApplication
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations: {}
    scheme: {}
